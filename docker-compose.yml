services:
  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    networks:
      - backend
    depends_on:
      - auth
      - venue
      - booking
      - review
      - audit

  auth:
    build: ./services/auth
    ports:
      - "4001:4001"
    networks:
      - backend

  venue:
    build: ./services/venue
    ports:
      - "4002:4002"
    networks:
      - backend

  booking:
    build: ./services/booking
    ports:
      - "4003:4003"
    networks:
      - backend

  review:
    build: ./services/review
    ports:
      - "4004:4004"
    networks:
      - backend

  audit:
    build: ./services/audit
    ports:
      - "4005:4005"
    networks:
      - backend

networks:
  backend: